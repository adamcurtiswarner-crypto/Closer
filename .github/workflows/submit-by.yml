name: Submission runway

# Deliberately `schedule`, not `push`. ci.yml is push-only, and during the
# ten silent days of August it ran zero times — so a check hung off a push
# would have been exactly as quiet as the humans were. This one fires whether
# or not anyone commits, which is the entire point.
on:
  schedule:
    - cron: '0 14 * * *' # 14:00 UTC daily (09:00 ET)
  workflow_dispatch:

jobs:
  submit-by:
    # Named for what it checks, not for one of its steps. It was
    # "SUBMIT-BY date has not passed", so when the runway probes failed the
    # notification read "SUBMIT-BY date has not passed — Failed", which is a
    # contradiction a reader has to decode before they can act on it.
    name: Submission runway checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Reads the committed date out of STUDIO-STATUS.md, so the control and
      # the record cannot drift apart.
      - name: Check the committed submission date
        run: node scripts/check-submit-by.js

      # Probes the world, not the record: commit silence, MX on the domain
      # whose addresses the policy publishes, and the age of the privacy
      # page App Review actually fetches.
      #
      # Added 2026-11-21. The date check above only fails AFTER the date
      # passes, so it reported green through seven silent days in which a
      # scheduler failed daily, a retention loop failed weekly, CI went red
      # and four founder items did not move. A control that can only tell
      # you afterwards is not a control.
      - name: Probe the runway against reality
        run: node scripts/check-runway.js
